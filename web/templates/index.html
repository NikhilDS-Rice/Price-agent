<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Price Comparison Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    p.sub { color: #666; margin-top: 0; }
    form { display: flex; gap: 0.5rem; margin-top: 2rem; }
    input[type="text"] { flex: 1; padding: 0.6rem 0.8rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; border: none; border-radius: 6px; background: #1a7f37; color: white; cursor: pointer; }
    button:hover { background: #166430; }
  </style>
</head>
<body>
  <h1>Price Comparison Agent</h1>
  <p class="sub">Find the best deal for a product across major retailers.</p>
  <form action="/search" method="post">
    <input type="text" name="product" placeholder="e.g. Sony WH-1000XM5 headphones" required autofocus>
    <button type="submit">Search</button>
  </form>
</body>
</html>
